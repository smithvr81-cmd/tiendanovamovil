name: Nova Movil - Preparar publicaciones sociales
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'
permissions:
  contents: read
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client google-auth
      - name: Revisar videos en Drive (sin publicar)
        env:
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          SOCIAL_VIDEO_FOLDER_ID: ${{ vars.SOCIAL_VIDEO_FOLDER_ID || '1djo0rGuSElpX6ntvFWd3Y4LMuylBbKgx' }}
        run: python scripts/social_video_prepare.py
