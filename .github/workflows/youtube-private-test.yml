name: Nova Movil - Prueba privada YouTube
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'ID de video de Google Drive'
        required: true
        type: string
      confirmacion:
        description: 'Escribe PUBLICAR para subir como PRIVADO'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nova-youtube-private-test
  cancel-in-progress: false
jobs:
  prueba:
    if: ${{ inputs.confirmacion == 'PUBLICAR' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client google-auth google-auth-oauthlib
      - name: Subir video privado
        env:
          CONFIRM_PUBLISH: ${{ inputs.confirmacion }}
          DRIVE_VIDEO_ID: ${{ inputs.video_id }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/youtube_upload_private.py
